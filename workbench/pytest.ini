[pytest]
# 从 workbench/ 目录运行:python -m pytest tests -q
# testpaths 与 pythonpath 都相对本文件所在目录,保证 engine/ 与 app/ 可导入。
testpaths = tests
pythonpath = .
# tests/test_ai.py 与 tests/api/test_ai.py 同名(test_news.py 亦然)。
# 默认 prepend 导入模式按文件名建模块名,同名即冲突;importlib 模式按路径
# 唯一定位,无需给测试目录加 __init__.py。
addopts = --import-mode=importlib
markers =
    unit: 纯函数/单模块单元测试,不碰数据库与网络
    integration: 需要临时 DuckDB 的集成测试(始终用 tmp_path,绝不碰真实库)
    api: 通过 FastAPI TestClient 的接口测试
