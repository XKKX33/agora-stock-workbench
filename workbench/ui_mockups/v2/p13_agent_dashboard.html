<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent 研判看板 · Hermes Quant</title>
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <div class="app-layout">
    <div id="app-shell"></div>
    <main class="main-shell">
      <div id="error-banner" class="error-banner" role="alert"></div>
      <header class="page-header">
        <div>
          <div class="eyebrow">Agent report dashboard</div>
          <h1>独立 Agent 研判看板</h1>
          <p>先回放已落库的公开通话，再订阅实时事件；隐藏思维链不会进入页面。</p>
        </div>
        <div class="button-row">
          <label class="dashboard-select-label" for="agent-job-select">研判批次</label>
          <select id="agent-job-select" class="field" aria-label="选择研判批次">
            <option value="">加载批次中…</option>
          </select>
          <button id="agent-dashboard-refresh" class="button primary" type="button">刷新看板</button>
        </div>
      </header>

      <section class="dashboard-grid" aria-label="Agent 研判报告">
        <article class="panel dashboard-status-panel" aria-labelledby="batch-status-title">
          <div class="panel-header"><div><h2 id="batch-status-title">批次状态</h2><p id="batch-status-note">选择批次后加载详情</p></div><span id="batch-status-tag" class="tag muted">未选择</span></div>
          <div id="batch-status" class="dashboard-status-grid"><div class="empty-state">暂无批次数据</div></div>
        </article>

        <article class="panel dashboard-timeline-panel" aria-labelledby="timeline-title">
          <div class="panel-header"><div><h2 id="timeline-title">实时通话</h2><p>公开结构化消息与引用，按序号续接</p></div><span id="stream-status" class="tag muted">未连接</span></div>
          <div id="agent-event-timeline" class="event-timeline" aria-live="polite"><div class="empty-state">选择批次以查看公开通话</div></div>
        </article>

        <article class="panel" aria-labelledby="matrix-title">
          <div class="panel-header"><div><h2 id="matrix-title">分析师 / 辩论矩阵</h2><p>方法论、舆情、走势与多空交锋</p></div></div>
          <div id="debate-matrix" class="debate-matrix"><div class="empty-state">暂无研判消息</div></div>
        </article>

        <article class="panel" aria-labelledby="risk-title">
          <div class="panel-header"><div><h2 id="risk-title">风控</h2><p>Risk chair 的公开结论与引用</p></div></div>
          <div id="risk-chair" class="risk-chair"><div class="empty-state">暂无风控结论</div></div>
        </article>

        <article class="panel dashboard-returns-panel" aria-labelledby="returns-title">
          <div class="panel-header"><div><h2 id="returns-title">收益验证</h2><p>等权组合收益；不可用槽位保持缺失，不伪造 0</p></div><span id="returns-run-note" class="tag muted">未选择批次</span></div>
          <div id="return-cards" class="return-cards" aria-label="T+1 收盘至 T+10 开盘收益卡片"><div class="empty-state">暂无收益数据</div></div>
        </article>
      </section>
    </main>
  </div>
  <script type="module" src="/assets/js/app-shell.js"></script>
  <script type="module" src="/assets/js/pages/agent-dashboard.js"></script>
</body>
</html>
