<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>行情K线 · Hermes Quant</title>
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="icon" href="data:,">
  <style>
    /* ---- 行情K线页私有样式（科技感：深底 + 青蓝光效 + 玻璃拟态，不改 theme.css） ---- */
    body {
      background-image:
        radial-gradient(1100px 560px at 12% -12%, rgba(62, 198, 255, .10), transparent 60%),
        radial-gradient(950px 540px at 92% -4%, rgba(139, 92, 246, .13), transparent 64%),
        radial-gradient(1100px 760px at 50% 114%, rgba(124, 58, 237, .08), transparent 62%);
      background-attachment: fixed;
    }

    .panel {
      background: linear-gradient(180deg, rgba(21, 31, 47, .94), rgba(13, 20, 32, .97));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .035), 0 22px 44px -30px rgba(0, 0, 0, .75);
    }

    .eyebrow { color: #a5b4fc; }
    .page-header h1 { text-shadow: 0 0 30px rgba(124, 58, 237, .30), 0 0 14px rgba(62, 198, 255, .18); }

    /* A股习惯：涨=红、跌=绿（页内自定义） */
    .up { color: #e05a5a; }
    .down { color: #3da678; }

    /* 顶部搜索框 + 下拉 */
    .search-box { position: relative; width: min(430px, 100%); }
    .search-box .field { width: 100%; transition: border-color .2s, box-shadow .2s; }
    .search-box .field:focus {
      border-color: #8b7cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, .20), 0 0 20px rgba(124, 58, 237, .16);
    }
    .suggest {
      position: absolute; top: calc(100% + 7px); left: 0; right: 0; z-index: 60;
      max-height: 360px; overflow: auto;
      border: 1px solid #33455f; border-radius: var(--radius);
      background: rgba(11, 18, 29, .98);
      box-shadow: 0 24px 48px -20px rgba(0, 0, 0, .85), 0 0 24px rgba(34, 211, 238, .06);
    }
    .suggest-empty { padding: 16px; color: var(--text-muted); font-size: 12px; }
    .suggest-item {
      display: grid; gap: 4px; width: 100%; padding: 10px 12px;
      border: 0; border-bottom: 1px solid var(--line-soft);
      border-radius: var(--radius-sm);
      background: transparent; color: var(--text); text-align: left; cursor: pointer;
    }
    .suggest-item:last-child { border-bottom: 0; }
    .suggest-item:hover, .suggest-item.active { background: linear-gradient(90deg, #16263f, #1d1a3d); }
    .suggest-main { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .suggest-main strong { font-size: 13px; }
    .suggest-meta { display: flex; align-items: baseline; gap: 8px; color: var(--text-muted); font-size: 11px; }

    /* 左右布局：300px 信息栏 + 主图区 */
    .chart-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }

    /* 个股信息栏 */
    .stock-head { padding-bottom: 14px; border-bottom: 1px solid var(--line-soft); }
    .stock-name { font: 600 21px var(--font-display); letter-spacing: .01em; }
    .stock-meta { margin-top: 3px; font-size: 12px; color: var(--text-muted); }
    .stock-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .quote-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; margin-top: 16px; }
    .metric-cell { display: grid; gap: 3px; }
    .metric-label { color: var(--text-muted); font-size: 10px; }
    .metric-value { font: 600 15px var(--font-mono); font-variant-numeric: tabular-nums; }

    /* 指标切换按钮组 */
    .chart-panel .panel-header { align-items: flex-start; }
    .indicator-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .indicator-btn {
      min-height: 30px; padding: 0 12px; font-size: 12px; color: var(--text-muted);
      transition: color .18s, border-color .18s, box-shadow .18s;
    }
    .indicator-btn.active {
      color: #c4b5fd; border-color: #7c5cd6; background: linear-gradient(135deg, #172a47, #241b4d);
      box-shadow: 0 0 16px rgba(124, 58, 237, .35), inset 0 1px 0 rgba(255, 255, 255, .06);
    }

    /* K线图区 */
    .chart-wrap { position: relative; }
    .kline-chart { width: 100%; height: 520px; }
    #chart-empty { position: absolute; inset: 0; z-index: 3; background: #0d1420; }
    .chart-wrap.has-data #chart-empty { display: none; }

    /* ECharts tooltip 内部排版 */
    .tip-title { margin-bottom: 6px; color: #9fd4f0; font: 600 12px var(--font-mono); }
    .tip-row { display: flex; justify-content: space-between; gap: 22px; font-size: 11px; line-height: 1.75; }
    .tip-label { color: var(--text-muted); }

    /* 自选股面板:工具栏 + 表格 */
    .watch-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
    .watch-toolbar .field { width: 150px; }
    .watch-toolbar .watch-add { width: 170px; }
    .watch-star { min-height: 34px; font-size: 12px; }
    .watch-star .star { color: #f5c14e; }
    .watch-row { cursor: pointer; }
    .watch-row:hover td { background: linear-gradient(90deg, rgba(62, 198, 255, .06), rgba(139, 92, 246, .08)); }
    .watch-remove {
      min-height: 26px; padding: 0 10px; font-size: 12px;
      color: var(--text-muted); border-color: rgba(148, 163, 184, .25);
      background: transparent;
    }
    .watch-remove:hover { color: #efc2c7; border-color: rgba(200, 93, 103, .5); }
    .watch-empty td { padding: 26px 12px; }

    @media (max-width: 1060px) {
      .chart-layout { grid-template-columns: 1fr; }
      .watch-toolbar { justify-content: flex-start; margin-top: 10px; }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div id="app-shell"></div>
    <main class="main-shell">
      <div id="error-banner" class="error-banner" role="alert"></div>

      <header class="page-header">
        <div>
          <div class="eyebrow">Market · K-line</div>
          <h1>行情K线</h1>
          <p>搜索任意 A 股，查看日 K、成交量和 MACD / KDJ / RSI 指标，以及近 10 日资金流向。</p>
        </div>
        <div class="search-box">
          <input id="kline-search" class="field" placeholder="输入代码或名称，如 600000" autocomplete="off"
                 role="combobox" aria-expanded="false" aria-controls="kline-suggest" aria-label="搜索股票">
          <div id="kline-suggest" class="suggest" role="listbox" hidden></div>
        </div>
      </header>

      <div class="chart-layout">
        <aside class="panel" aria-label="个股信息">
          <div class="panel-header">
            <div><h2>个股信息</h2><p id="info-sub">搜索股票或通过链接打开</p></div>
            <div id="watch-toggle"></div>
          </div>
          <div id="stock-info" class="stack">
            <div class="empty-state">等待选择股票<br>输入代码或名称开始搜索</div>
          </div>
        </aside>

        <section class="panel chart-panel" aria-label="K线图">
          <div class="panel-header">
            <div><h2>日K线</h2><p id="chart-sub">开盘 · 收盘 · 最高 · 最低</p></div>
            <div id="indicator-group" class="indicator-group" role="group" aria-label="指标切换">
              <button type="button" class="button indicator-btn active" data-ind="ma" aria-pressed="true">MA</button>
              <button type="button" class="button indicator-btn" data-ind="boll" aria-pressed="false">BOLL</button>
              <button type="button" class="button indicator-btn active" data-ind="macd">MACD</button>
              <button type="button" class="button indicator-btn" data-ind="kdj">KDJ</button>
              <button type="button" class="button indicator-btn" data-ind="rsi">RSI</button>
            </div>
          </div>
          <div class="chart-wrap">
            <div id="kline-chart" class="kline-chart"></div>
            <div id="chart-empty" class="empty-state">等待选择股票<br>输入代码或名称开始搜索</div>
          </div>
        </section>
      </div>

      <section class="panel" style="margin-top:16px" aria-label="资金流向">
        <div class="panel-header">
          <div><h2>资金流向</h2><p>最近 10 个交易日 · 净流入红涨绿跌</p></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>日期</th><th>净流入</th><th>大单买</th><th>大单卖</th><th>超大单买</th><th>超大单卖</th></tr></thead>
            <tbody id="moneyflow-rows"></tbody>
          </table>
        </div>
      </section>

      <section class="panel" style="margin-top:16px" aria-label="自选股行情">
        <div class="panel-header">
          <div><h2>自选股行情</h2><p>点击任意一行跳转 K 线 · 行情为各自最新交易日</p></div>
          <div class="watch-toolbar">
            <input id="watch-add-code" class="field watch-add" placeholder="输入代码或名称添加自选" autocomplete="off" aria-label="添加自选股">
            <button id="watch-add-btn" class="button primary" type="button">添加</button>
            <input id="watch-search" class="field" placeholder="筛选代码或名称" autocomplete="off" aria-label="筛选自选股">
            <select id="watch-industry" class="field" aria-label="按行业筛选"><option value="">全部行业</option></select>
            <button id="watch-refresh" class="button" type="button">刷新</button>
            <a class="button" href="p10_watchlist.html">管理自选</a>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>代码</th><th>名称</th><th>行业</th><th>收盘</th><th>涨跌幅</th><th>最新交易日</th><th></th></tr></thead>
            <tbody id="watch-rows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="/assets/vendor/echarts.min.js"></script>
  <script type="module" src="/assets/js/app-shell.js"></script>
  <script type="module" src="/assets/js/pages/chart.js"></script>
</body>
</html>
